<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- ---- Records (game over) ---- -->
        <div id="gameover-records" class="records hidden">
          <form id="record-form" class="record-form hidden">
            <label for="record-name">¡Nuevo récord! Tu nombre:</label>
            <div class="record-form-row">
              <input id="record-name" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
              <button id="record-save-btn" type="submit">Guardar</button>
            </div>
          </form>
          <table class="records-table" id="gameover-records-table"></table>
          <p class="records-stats" id="gameover-records-stats"></p>
          <button id="menu-btn" class="secondary-btn" type="button">Menú</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- ---- Records (start screen) ---- -->
    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <p class="start-title">TETRIS</p>
        <span class="label">MEJORES PUNTUACIONES</span>
        <table class="records-table" id="start-records-table"></table>
        <p class="records-stats" id="start-records-stats"></p>
        <button id="play-btn" type="button">Jugar</button>
        <button id="clear-records-btn" class="secondary-btn" type="button">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
